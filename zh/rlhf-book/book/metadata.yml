abstract: |
  基于人类反馈的强化学习（RLHF）已经成为构建新一代大规模机器学习系统的重要工具。
  围绕 RLHF 的核心方法，这一领域逐渐发展为今天更广泛的后训练技术体系。
  本书面向具有一定数理基础的读者，以经典 RLHF 流程为主线，全面介绍模型后训练的核心方法。
  全书首先解释 RLHF 的用途与诞生原因，回顾其发展历程中的关键技术里程碑，并介绍理解本书所需的强化学习背景。
  核心章节详细讲解 RLHF 的各个优化阶段：从指令微调、奖励模型训练，到拒绝采样、强化学习、同策略蒸馏及直接对齐算法。
  本书还讨论更广泛的主题，包括 RLHF 在近期文献中的起源，以及经济学、哲学和最优控制等不同领域思想的交汇。
  最后的章节讨论合成数据、工具使用、角色训练与评估中研究尚不充分或正在兴起的问题，以及这一领域的开放问题。
  本书配套提供[代码库](https://rlhfbook.com/code)、用于比较后训练各阶段模型补全的[示例库](https://rlhfbook.com/library)，以及[教学课程](https://rlhfbook.com/course)，帮助读者系统学习语言模型后训练的基础概念。上述链接指向原作英文资源。
